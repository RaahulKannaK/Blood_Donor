<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HemoHub - Donor Profile</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f7fb;
    color: #172b4d;
}

.sidebar {
    position: fixed;
    width: 240px;
    height: 100vh;
    background: #0b1f3a;
    color: white;
    padding: 25px 15px;
}

.logo {
    text-align: center;
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 35px;
}

.logo span {
    color: #e53935;
}

.menu a {
    display: block;
    color: white;
    text-decoration: none;
    padding: 14px;
    margin: 8px 0;
    border-radius: 8px;
}

.menu a:hover,
.menu .active {
    background: #c62828;
}

.main {
    margin-left: 240px;
    padding: 35px;
}

.container {
    max-width: 900px;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 3px 10px #00000015;
}

.profile-header {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 30px;
}

.avatar {
    width: 90px;
    height: 90px;
    background: #c62828;
    color: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 35px;
    font-weight: bold;
}

.profile-header h1 {
    margin-bottom: 5px;
}

.profile-header p {
    color: #667085;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.field label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
}

.field input,
.field select {
    width: 100%;
    padding: 12px;
    border: 1px solid #d0d5dd;
    border-radius: 7px;
    outline: none;
}

.field input:focus,
.field select:focus {
    border-color: #c62828;
}

.full {
    grid-column: 1 / 3;
}

button {
    margin-top: 25px;
    background: #c62828;
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 7px;
    cursor: pointer;
}

button:hover {
    background: #a91f1f;
}

.message {
    margin-top: 15px;
    color: green;
    font-weight: bold;
}

@media(max-width: 700px) {

    .sidebar {
        display: none;
    }

    .main {
        margin-left: 0;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .full {
        grid-column: auto;
    }
}

</style>

</head>

<body>

<div class="sidebar">

    <div class="logo">
        Hemo<span>Hub</span>
    </div>

    <div class="menu">

        <a href="dashboard.html">🏠 Dashboard</a>

        <a href="#" class="active">👤 Profile</a>

        <a href="radar.html">📍 Blood Radar</a>

        <a href="requests.html">🩸 Requests</a>

        <a href="alerts.html">🔔 Alerts</a>

        <a href="history.html">📋 History</a>

        <a href="#">🚪 Logout</a>

    </div>

</div>


<div class="main">

<h1>Donor Profile</h1>

<br>

<div class="container">

    <div class="profile-header">

        <div class="avatar">
            K
        </div>

        <div>

            <h1>Karthika</h1>

            <p>Blood Donor</p>

        </div>

    </div>


    <form id="profileForm">

        <div class="form-grid">

            <div class="field">

                <label>Full Name</label>

                <input
                    type="text"
                    id="name"
                    value="Karthika"
                >

            </div>


            <div class="field">

                <label>Age</label>

                <input
                    type="number"
                    id="age"
                    value="21"
                >

            </div>


            <div class="field">

                <label>Username</label>

                <input
                    type="text"
                    id="username"
                    value="karthika"
                    readonly
                >

            </div>


            <div class="field">

                <label>Blood Group</label>

                <select id="blood">

                    <option>O+</option>
                    <option>O-</option>
                    <option>A+</option>
                    <option>A-</option>
                    <option>B+</option>
                    <option>B-</option>
                    <option>AB+</option>
                    <option>AB-</option>

                </select>

            </div>


            <div class="field">

                <label>Phone Number</label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter phone number"
                >

            </div>


            <div class="field">

                <label>City</label>

                <input
                    type="text"
                    id="city"
                    value="Coimbatore"
                >

            </div>


            <div class="field full">

                <label>Last Donation Date</label>

                <input
                    type="date"
                    id="lastDonation"
                >

            </div>

        </div>


        <button type="submit">
            Save Profile
        </button>

    </form>


    <div id="message" class="message"></div>

</div>

</div>


<script>

document
.getElementById("profileForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    document
    .getElementById("message")
    .innerText =
    "Profile updated successfully!";

});

</script>

</body>
