<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HemoHub - Welcome</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
        }

        .container {
            width: 420px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #c62828;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 35px;
        }

        .welcome {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #c62828;
        }

        .continue-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #c62828;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .continue-btn:hover {
            background: #a91f1f;
        }

        .links {
            margin-top: 22px;
            text-align: center;
        }

        .links a {
            display: block;
            margin: 10px;
            text-decoration: none;
            color: #c62828;
            font-size: 14px;
        }

        .message {
            background: #ffe5e5;
            color: #b71c1c;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="logo">
        🩸 HemoHub
    </div>

    <div class="subtitle">
        Blood Donation & Emergency Support
    </div>

    <div class="welcome">
        Welcome 👋
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="message">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <label>
            Name
        </label>

        <input
            type="text"
            name="name"
            placeholder="Enter your name"
            required
        >

        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Enter your password"
            required
        >

        <button
            type="submit"
            class="continue-btn">
            Continue
        </button>

    </form>

    <div class="links">

        <a href="{% url 'forgot_password' %}">
            Forgot Password?
        </a>

        <a href="{% url 'register' %}">
            Don't have an account? Register
        </a>

    </div>

</div>

</body>

</html>
