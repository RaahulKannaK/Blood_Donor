<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>HemoHub - Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f5f5;
            display: flex;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            width: 260px;
            background: #191919;
            color: white;
            padding: 30px 20px;

            display: flex;
            flex-direction: column;
        }

        .logo {
            font-size: 27px;
            font-weight: bold;
            color: #ff4d4d;
            margin-bottom: 50px;
        }

        .person {
            display: flex;
            align-items: center;
            gap: 14px;

            padding: 15px;
            border-radius: 12px;
            background: #292929;
        }

        .profile-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #c62828;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;
        }

        .person-name {
            font-size: 16px;
            font-weight: bold;
        }

        .person-text {
            color: #aaa;
            font-size: 12px;
            margin-top: 4px;
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            flex: 1;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px;
        }

        .login-box {
            width: 500px;
            background: white;

            padding: 40px;

            border-radius: 20px;

            box-shadow:
                0 10px 40px rgba(0,0,0,0.1);
        }

        .title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .description {
            color: #777;
            margin-bottom: 30px;
        }

        /* =========================
           ROLE BUTTONS
        ========================= */

        .roles {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .role-btn {
            flex: 1;

            padding: 13px;

            border: 2px solid #ddd;
            background: white;

            border-radius: 10px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .role-btn:hover {
            border-color: #c62828;
        }

        .role-btn.active {
            background: #c62828;
            color: white;
            border-color: #c62828;
        }

        input {
            width: 100%;

            padding: 14px;

            margin-top: 8px;
            margin-bottom: 20px;

            border: 1px solid #ddd;

            border-radius: 10px;

            outline: none;

            font-size: 15px;
        }

        input:focus {
            border-color: #c62828;
        }

        label {
            font-weight: bold;
        }

        .login-btn {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #c62828;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .login-btn:hover {
            background: #a91f1f;
        }

        .message {
            background: #ffe5e5;
            color: #b71c1c;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 20px;

            text-align: center;
        }

    </style>

</head>

<body>


<!-- =========================
     SIDEBAR
========================= -->

<div class="sidebar">

    <div class="logo">
        🩸 HemoHub
    </div>

    <div class="person">

        <div class="profile-icon">
            👤
        </div>

        <div>

            <div class="person-name">
                {{ person_name }}
            </div>

            <div class="person-text">
                Welcome back
            </div>

        </div>

    </div>

</div>


<!-- =========================
     MAIN LOGIN
========================= -->

<div class="main">

    <div class="login-box">

        <div class="title">
            Continue to HemoHub
        </div>

        <div class="description">
            Select your role and login to your account.
        </div>


        {% if messages %}

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <!-- ROLE BUTTONS -->

            <div class="roles">

                <button
                    type="button"
                    class="role-btn"
                    onclick="selectRole('donor', this)">
                    🩸 Donor
                </button>

                <button
                    type="button"
                    class="role-btn"
                    onclick="selectRole('needer', this)">
                    🚨 Needer
                </button>

                <button
                    type="button"
                    class="role-btn"
                    onclick="selectRole('admin', this)">
                    🛡️ Admin
                </button>

            </div>


            <!-- Hidden role field -->

            <input
                type="hidden"
                name="role"
                id="role"
            >


            <!-- USERNAME -->

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >


            <!-- PASSWORD -->

            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >


            <button
                type="submit"
                class="login-btn">
                Login
            </button>

        </form>

    </div>

</div>


<script>

    function selectRole(role, button) {

        // Set hidden role
        document.getElementById("role").value = role;

        // Remove active from all buttons
        const buttons =
            document.querySelectorAll(".role-btn");

        buttons.forEach(function(btn) {

            btn.classList.remove("active");

        });

        // Activate selected button
        button.classList.add("active");
    }

</script>

</body>

</html>
