
<!DOCTYPE html>
<html>
<head>
    <title>SOS Blood Bank - Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f5f5f5;
        }

        .container {
            width: 380px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #ccc;
            text-align: center;
        }

        h1 {
            color: #a00000;
        }

        .roles button {
            padding: 12px 20px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .roles button:hover {
            background: #a00000;
            color: white;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        .login {
            width: 95%;
            padding: 12px;
            background: #a00000;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        a {
            color: #a00000;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🩸 SOS Blood Bank</h1>

    <h3>Select Role</h3>

    <div class="roles">
        <button onclick="selectRole('Donor')">DONOR</button>
        <button onclick="selectRole('Needer')">NEEDER</button>
        <button onclick="selectRole('Admin')">ADMIN</button>
    </div>

    <p id="roleText">No role selected</p>

    <input type="text" placeholder="Username">

    <input type="password" placeholder="Password">

    <button class="login" onclick="login()">
        LOGIN
    </button>

    <p>
        <a>Forgot Password?</a>
    </p>

    <p>
        Don't have an account?
        <a href="#">Register</a>
    </p>

</div>

<script>

let selectedRole = "";

function selectRole(role) {

    selectedRole = role;

    document.getElementById("roleText").innerHTML =
        "Selected Role: <b>" + role + "</b>";
}

function login() {

    if (selectedRole === "") {
        alert("Please select a role");
        return;
    }

    alert("Login request sent for " + selectedRole);

}

</script>

</body>
</html>
